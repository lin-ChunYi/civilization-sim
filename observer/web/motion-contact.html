<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G_MOTION_01 8-phase contact</title>
<style>
  body{background:#12100c;color:#f3deaa;font:13px/1.4 sans-serif;margin:12px}
  table{border-collapse:collapse}
  td,th{border:1px solid #3a3228;padding:4px;text-align:center}
  svg{background:#1a140e}
  caption{caption-side:top;margin-bottom:8px}
</style>
</head>
<body>
<h1>8-phase contact · layered gait</h1>
<p>Root fixed. Limb angles change. Phase 0 equals phase 1. Directions share/mirror — see MOTION_SHEET.json.</p>
<div id="sheet"></div>
<script src="/static/motion.js"></script>
<script>
const M = window.Motion;
const pal = { cloth:"#6a5340", skin:"#e2c7a4", hair:"#2a1810", sash:"#8a6a3a", accent:"#d4b06a" };
const rows = M.contactRows();
let html = "<table><caption>6 skins × phases 0..7 and 1.0</caption><tr><th>skin</th>";
for (let i = 0; i < 8; i++) html += "<th>p=" + (i/8).toFixed(3) + "</th>";
html += "<th>p=1</th></tr>";
rows.forEach((row) => {
  html += "<tr><th>" + row.skin + "</th>";
  row.cells.forEach((s) => {
    html += "<td><svg viewBox='-18 -22 36 40' width='72' height='80'>" + M.rigMarkup(s, pal) + "</svg></td>";
  });
  html += "</tr>";
});
html += "</table>";
document.getElementById("sheet").innerHTML = html;
</script>
</body>
</html>
